## MintPy small-baseline time series for Samsen, HyP3 ISCE burst products clipped by 02_download.py.
## Run from pipeline/:  mkdir -p mintpy_asc_5x1 && cd mintpy_asc_5x1 && ../tools/mintpy-env/bin/smallbaselineApp.py ../samsen_asc_5x1.cfg
## Ascending track 172 (SW_TRACK=asc). Same settings as samsen_5x1.cfg except paths, reference and end date.

mintpy.compute.maxMemory = 4

mintpy.load.processor      = hyp3
mintpy.load.unwFile        = ../data-asc/5x1/*/*_unw_phase.tif
mintpy.load.corFile        = ../data-asc/5x1/*/*_corr.tif
mintpy.load.connCompFile   = ../data-asc/5x1/*/*_conncomp.tif
mintpy.load.demFile        = ../data-asc/5x1/*/*_dem.tif
mintpy.load.incAngleFile   = ../data-asc/5x1/*/*_lv_theta.tif
mintpy.load.azAngleFile    = ../data-asc/5x1/*/*_lv_phi.tif
mintpy.load.waterMaskFile  = no

## Keep every pair; the network is already short-baseline (next 3 acquisitions).
mintpy.network.coherenceBased = no
## Pre-event only, so no post-event pair can influence the inverted pre-event time series.
## Post-event pairs are used separately by 04_locate_event.py.
mintpy.network.endDate = 20250913

## Reference: auto for the first run. To compare with the descending set, pin the same stable area
## once the ascending coherence map is inspected.
mintpy.reference.lalo = auto

## No ERA5 (needs a separate CDS account). Over a 4 km AOI, most tropospheric delay is common to all
## pixels and is removed by referencing; the remaining turbulence is noise the detector must tolerate.
mintpy.troposphericDelay.method = no
mintpy.deramp = no
mintpy.topographicResidual = yes

mintpy.save.kmz = no
mintpy.save.hdfEos5 = no
mintpy.plot = no
