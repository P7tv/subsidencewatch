## MintPy small-baseline time series for Samsen, HyP3 ISCE burst products clipped by 02_download.py.
## Run from pipeline/:  mkdir -p mintpy_5x1 && cd mintpy_5x1 && ../tools/mintpy-env/bin/smallbaselineApp.py ../samsen_5x1.cfg
## The 10x2 and 5x1 files differ only in the input paths and the reference point.

mintpy.compute.maxMemory = 4

mintpy.load.processor      = hyp3
mintpy.load.unwFile        = ../data/5x1/*/*_unw_phase.tif
mintpy.load.corFile        = ../data/5x1/*/*_corr.tif
mintpy.load.connCompFile   = ../data/5x1/*/*_conncomp.tif
mintpy.load.demFile        = ../data/5x1/*/*_dem.tif
mintpy.load.incAngleFile   = ../data/5x1/*/*_lv_theta.tif
mintpy.load.azAngleFile    = ../data/5x1/*/*_lv_phi.tif
mintpy.load.waterMaskFile  = no

## Keep every pair; the network is already short-baseline (next 3 acquisitions).
mintpy.network.coherenceBased = no
## Pre-event only, so no post-event pair can influence the inverted pre-event time series.
## Post-event pairs are used separately by 04_locate_event.py.
mintpy.network.endDate = 20250923

## Reference: pinned to the pixel MintPy chose automatically for the published bundle (highest coherence,
## ~1.8 km north of the collapse), so reruns use the same one. Its stability is not verified: no
## levelling or GNSS benchmark was available. Replace with a surveyed stable point when one is.
mintpy.reference.lalo = 13.79615, 100.50338

## No ERA5 (needs a separate CDS account). Over a 4 km AOI, most tropospheric delay is common to all
## pixels and is removed by referencing; the remaining turbulence is noise the detector must tolerate.
mintpy.troposphericDelay.method = no
mintpy.deramp = no
mintpy.topographicResidual = yes

mintpy.save.kmz = no
mintpy.save.hdfEos5 = no
mintpy.plot = no
